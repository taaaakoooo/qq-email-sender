<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮件通知</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f2f4f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px;max-width:100%;background-color:#ffffff;border-radius:10px;overflow:hidden;
                      box-shadow:0 2px 8px rgba(0,0,0,0.06);font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;">
          <!-- 顶部标题 -->
          <tr>
            <td style="background-color:#2f6fed;padding:28px 32px;">
              <h1 style="margin:0;font-size:22px;line-height:30px;color:#ffffff;font-weight:600;">邮件通知</h1>
              <p style="margin:8px 0 0;font-size:13px;line-height:20px;color:#dbe6ff;">这是一封 HTML 格式的邮件</p>
            </td>
          </tr>
          <!-- 正文 -->
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:15px;line-height:26px;color:#333333;">你好：</p>
              <p style="margin:0 0 16px;font-size:15px;line-height:26px;color:#333333;">
                这里是邮件正文，请在 <code style="background-color:#f2f4f8;padding:2px 6px;border-radius:4px;
                font-family:Consolas,monospace;font-size:13px;">content.html</code> 中替换成你自己的内容。
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="margin:20px 0;background-color:#f7f9fc;border-left:3px solid #2f6fed;border-radius:4px;">
                <tr>
                  <td style="padding:16px 20px;font-size:14px;line-height:24px;color:#555555;">
                    支持任意 HTML 与内联样式，QQ 邮箱、163 邮箱、Outlook 均可正常显示。
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:15px;line-height:26px;color:#333333;">
                祝好<br>
                <span style="color:#888888;font-size:14px;">发件人名称</span>
              </p>
            </td>
          </tr>
          <!-- 页脚 -->
          <tr>
            <td style="padding:18px 32px;background-color:#f7f9fc;border-top:1px solid #eceff3;">
              <p style="margin:0;font-size:12px;line-height:20px;color:#9aa4b2;">
                此邮件由脚本自动发送，请勿直接回复。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
